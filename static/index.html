<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phi-3 Mini Chat</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a2e;
    --user: #2563eb;
    --bot: #1f2740;
    --text: #e6e9f2;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #222b45;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  header .model { color: var(--muted); font-size: 12px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #7f1d1d; }
  form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #222b45; }
  textarea {
    flex: 1; resize: none; height: 52px; padding: 14px; border-radius: 12px;
    border: 1px solid #2a3555; background: var(--panel); color: var(--text);
    font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--user); }
  button {
    padding: 0 22px; border: 0; border-radius: 12px; background: var(--user);
    color: white; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #2a3555; padding: 0 16px; }
  select {
    padding: 6px 10px; border-radius: 10px; border: 1px solid #2a3555;
    background: var(--panel); color: var(--text); font: inherit; font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Phi-3 Mini</h1>
    <span class="model" id="model">loading…</span>
    <select id="modelSelect" title="Model preset"></select>
    <button class="secondary" id="reset" type="button">Reset</button>
  </header>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelEl = document.getElementById('model');
let history = [];
const modelSelect = document.getElementById('modelSelect');

fetch('/health').then(r => r.json()).then(d => {
  modelEl.textContent = d.model + (d.model_present ? '' : ' (missing!)');
  (d.presets || []).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    modelSelect.appendChild(opt);
  });
}).catch(() => modelEl.textContent = 'offline');

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

async function send(text) {
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const bubble = addMsg('assistant', '');
  sendBtn.disabled = true;
  try {
    const res = await fetch('/v1/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, max_tokens: 512, model: modelSelect.value }),
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', full = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          if (obj.error) throw new Error(obj.error);
          full += obj.delta || '';
          bubble.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        } catch (_) {}
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    bubble.className = 'msg error';
    bubble.textContent = 'Error: ' + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

document.getElementById('reset').addEventListener('click', () => {
  history = [];
  chatEl.innerHTML = '';
});
</script>
</body>
</html>
